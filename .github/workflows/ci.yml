name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION:     ap-south-1
  ECR_REPOSITORY: devops-project/app-service

jobs:

  # ── Job 1: Lint + Test ──────────────────────────────────────
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --ignore=E501

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ── Job 2: Build + Scan + Push to ECR ──────────────────────
  build-scan-push:
    name: Build, Scan and Push to ECR
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update k8s-config with new image tag
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/aryanjain6061/devops-project-k8s.git
          cd devops-project-k8s
          git config user.email "ci-bot@devops-project.com"
          git config user.name "CI Bot"

          # Update image tag in staging values
          sed -i "s|tag:.*|tag: ${{ steps.vars.outputs.IMAGE_TAG }}|g" \
            charts/app-service/values-staging.yaml

          git add charts/app-service/values-staging.yaml
          git commit -m "chore: bump app-service image to ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push origin staging

      - name: Print summary
        run: |
          echo "================================"
          echo "Image pushed to ECR:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_TAG }}"
          echo "================================"
